server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:8001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://backend:8001/auth/;
        proxy_set_header Host $host;
    }

    location /servers/ {
        proxy_pass http://backend:8001/servers/;
        proxy_set_header Host $host;
    }

    location /gametracker/ {
        proxy_pass http://backend:8001/gametracker/;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://backend:8001/admin/;
        proxy_set_header Host $host;
    }

    location /admins/ {
        proxy_pass http://backend:8001/admins/;
        proxy_set_header Host $host;
    }

    location /users/ {
        proxy_pass http://backend:8001/users/;
        proxy_set_header Host $host;
    }

    location /skins/ {
        proxy_pass http://backend:8001/skins/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
